<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>年度观影报告 · 2025—2026</title>
<style>
  :root{
    --bg:#08080a; --ink:#ece6dc; --dim:#8e8578; --dim2:#6b645b;
    --gold:#d8a657; --gold2:#f0cf95; --red:#c1554a; --jade:#7fa88f;
    --line:rgba(255,255,255,.09);
    --serif:"Source Han Serif SC","Noto Serif SC","Songti SC","STSong","SimSun",serif;
    --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:var(--sans);display:flex;align-items:center;justify-content:center;
    padding:60px 24px;position:relative;overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(900px 600px at 15% -10%,rgba(216,166,87,.13),transparent 62%),
      radial-gradient(760px 520px at 88% 6%,rgba(193,85,74,.08),transparent 60%),
      radial-gradient(900px 700px at 55% 110%,rgba(127,168,143,.06),transparent 62%);
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.035'/></svg>");
  }
  main{position:relative;z-index:2;width:100%;max-width:1000px;text-align:center}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.42em;color:var(--gold);margin:0 0 26px}
  h1{font-family:var(--serif);font-size:clamp(34px,5.4vw,58px);margin:0;letter-spacing:.22em;text-indent:.22em;font-weight:700}
  .sub{margin:20px 0 0;font-size:13px;color:var(--dim);letter-spacing:.16em}
  .rule{width:56px;height:1px;background:rgba(255,255,255,.18);margin:38px auto 44px}
  .years{display:grid;grid-template-columns:1fr 1fr;gap:18px;text-align:left}
  .ycard{
    position:relative;display:block;padding:34px 32px 30px;border:1px solid var(--line);border-radius:4px;
    background:linear-gradient(165deg,rgba(255,255,255,.03),transparent 45%),linear-gradient(180deg,#111116,#0b0b0e);
    text-decoration:none;color:inherit;overflow:hidden;transition:.45s;
  }
  .ycard::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,rgba(216,166,87,.55),transparent)}
  .ycard.light::before{background:linear-gradient(90deg,transparent,rgba(255,107,107,.5),transparent)}
  .ycard::after{content:"";position:absolute;inset:0;background:radial-gradient(420px 220px at 100% 0%,rgba(216,166,87,.10),transparent 70%);opacity:0;transition:.45s}
  .ycard:hover{transform:translateY(-5px);border-color:rgba(216,166,87,.34);box-shadow:0 26px 54px -28px #000}
  .ycard:hover::after{opacity:1}
  .ycard .yr{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--gold);position:relative;z-index:2}
  .ycard .n{display:flex;align-items:baseline;gap:8px;margin:18px 0 0;font-family:var(--serif);font-size:clamp(46px,6vw,64px);line-height:1;position:relative;z-index:2;
    background:linear-gradient(180deg,#fff4e2,#e8c58c 60%,#b98a3f);-webkit-background-clip:text;background-clip:text;color:transparent}
  .ycard .n em{font-style:normal;font-size:15px;font-family:var(--sans);color:var(--dim);letter-spacing:.1em;-webkit-text-fill-color:var(--dim)}
  .ycard .d{display:block;margin-top:16px;font-size:12.5px;color:var(--dim);letter-spacing:.04em;position:relative;z-index:2}
  .ycard .go{display:inline-block;margin-top:28px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--dim);position:relative;z-index:2;transition:.3s}
  .ycard:hover .go{color:var(--gold2)}
  .ycard.light{background:linear-gradient(165deg,rgba(255,255,255,.05),transparent 45%),linear-gradient(180deg,#101015,#0b0b0e)}
  .note{margin:40px 0 0;font-size:11.5px;color:var(--dim2);letter-spacing:.08em;line-height:2}
  .foot{margin-top:52px;font-family:var(--mono);font-size:10px;letter-spacing:.22em;color:var(--dim2)}
  @media (max-width:720px){
    .years{grid-template-columns:1fr}
    h1{letter-spacing:.14em;text-indent:.14em}
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Annual Movie Report</p>
  <h1>年度观影报告</h1>
  <p class="sub">2025 — 2026 · 两年，二百二十二部</p>
  <div class="rule"></div>

  <div class="years">
    <a class="ycard light" href="2025/2025.MovieReview.html">
      <span class="yr">2025</span>
      <span class="n">87<em>部</em></span>
      <span class="d">平均 3.91 / 5 · 光影记录时光，镜头看见世界</span>
      <span class="go">进入报告 →</span>
    </a>
    <a class="ycard" href="2026/2026.MovieReview.html">
      <span class="yr">2026</span>
      <span class="n">135<em>部</em></span>
      <span class="d">平均 3.73 / 5 · 36,564 字短评 · 仍在更新</span>
      <span class="go">进入报告 →</span>
    </a>
  </div>

  <p class="note">2026 报告年末还会补录：三大电影节入选数、年度五佳其余四席、以及三张海报。</p>
  <p class="foot">豆瓣 ID 286590474 · 数据源 Douban 片单</p>
</main>
</body>
</html>
